name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            preset: ci-macos
          - os: ubuntu-latest
            name: Linux
            preset: ci-linux
          - os: windows-latest
            name: Windows
            preset: ci-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QtQuick/QtQml (qtdeclarative) ships in the base archives, not as an
      # addon module — do not add it to `modules:`, aqt rejects it there.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.*"
          cache: true

      # Every job here must stay hardware-independent: only the mock camera
      # backend is exercised (RELEASE_AND_PACKAGING.md section 3).
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
