name: Linux package

on:
  push:
    branches: [main, 'codex/linux-mint-support']
    paths-ignore: ['README.md', 'CHANGELOG.md', 'CONTRIBUTING.md', 'assets/**', '.gitignore']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    # Mint 21 uses Ubuntu 22.04; building here also covers newer Mint bases.
    name: Linux x86-64 / Mint
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.3'
          modules: qtimageformats
          cache: true
      - name: Install build and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache pkg-config libcfitsio-dev libraw-dev libusb-1.0-0-dev libuvc-dev libgl1-mesa-dev libxcb-cursor0 libxkbcommon-x11-0 xvfb desktop-file-utils
      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: mint-qt693-${{ hashFiles('cmake/AstroVision.cmake') }}-${{ github.sha }}
          restore-keys: mint-qt693-${{ hashFiles('cmake/AstroVision.cmake') }}-
      - name: Configure
        run: cmake --preset release-linux -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build --preset release-linux --parallel 4
      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: mint-qt693-${{ hashFiles('cmake/AstroVision.cmake') }}-${{ github.sha }}
      - name: Test
        run: ctest --preset release-linux
      - name: Build AppImage
        run: scripts/package_linux.sh --skip-build
      - name: Check installed codecs and QML over X11
        run: |
          mkdir -p build/linux-smoke/config build/linux-smoke/data build/linux-smoke/cache
          export XDG_CONFIG_HOME="$PWD/build/linux-smoke/config"
          export XDG_DATA_HOME="$PWD/build/linux-smoke/data"
          export XDG_CACHE_HOME="$PWD/build/linux-smoke/cache"
          export QT_QUICK_BACKEND=software
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a build/release-linux/AstroCapture-*-x86_64.AppImage --check-installation | tee build/release-linux/installation-check.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('build/release-linux/installation-check.json').read_text())
          assert result['ok']
          assert set(result['cameraDrivers']) == {'mock', 'uvc', 'euvc', 'zwo'}
          PY
      - name: Check package on the Mint 22 Ubuntu base without Qt installed
        run: |
          docker run --rm -v "$PWD/build/release-linux:/package:ro" ubuntu:24.04 bash -lc '
            set -e
            apt-get update > /tmp/apt-update.log 2>&1
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates tzdata libgl1 libegl1 libfontconfig1 libx11-xcb1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-randr0 libxcb-shape0 libxcb-xfixes0 libxcb-sync1 fonts-dejavu-core > /tmp/apt-install.log 2>&1
            export LANG=C.UTF-8 QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software APPIMAGE_EXTRACT_AND_RUN=1
            timeout 30 /package/AstroCapture-*-x86_64.AppImage --check-installation
          '
      - name: Upload Linux distribution
        uses: actions/upload-artifact@v4
        with:
          name: AstroCapture-Linux-x86_64
          path: |
            build/release-linux/AstroCapture-*-x86_64.AppImage
            build/release-linux/SHA256SUMS
            build/release-linux/installation-check.json
            build/release-linux/linux-camera-access/
          if-no-files-found: error
          retention-days: 30
