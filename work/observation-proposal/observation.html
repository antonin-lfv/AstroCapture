<div id="ac-observation">
<style>
#ac-observation{--ac-bg:light-dark(#f5f5f5,#191919);--ac-panel:light-dark(#eaeaea,#232323);--ac-text:light-dark(#222,#ededed);--ac-muted:light-dark(#595959,#b5b5b5);--ac-line:light-dark(#ccc,#3c3c3c);--ac-blue:light-dark(#2769aa,#83b4df);--ac-band:light-dark(#dde9f1,#263946);font:13px -apple-system,BlinkMacSystemFont,sans-serif;color:var(--ac-text)}
#ac-observation *{box-sizing:border-box}#ac-observation .ac-window{background:var(--ac-bg);min-height:650px}#ac-observation header{padding:18px 24px;border-bottom:1px solid var(--ac-line);display:flex;align-items:center;gap:24px;flex-wrap:wrap}#ac-observation .ac-brand{font-weight:600}#ac-observation .ac-nav{color:var(--ac-muted)}#ac-observation .ac-nav strong{color:var(--ac-blue);font-weight:500}#ac-observation .ac-title{padding:24px 24px 16px}#ac-observation h2{font-size:24px;font-weight:500;margin:0 0 8px}#ac-observation h3{font-size:14px;font-weight:500;margin:0 0 16px}#ac-observation .ac-muted{color:var(--ac-muted)}#ac-observation .ac-layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:0}#ac-observation .ac-main{padding:16px 24px;min-width:0}#ac-observation aside{padding:20px;background:var(--ac-panel);border-left:1px solid var(--ac-line)}#ac-observation label{display:block;margin-bottom:18px}#ac-observation label span{display:block;margin-bottom:8px}#ac-observation select,#ac-observation input:not([type=range]),#ac-observation button{font:inherit;color:var(--ac-text);background:var(--ac-bg);border:1px solid var(--ac-line);border-radius:4px;padding:8px 10px;max-width:100%}#ac-observation select,#ac-observation input{width:100%}#ac-observation button:hover{background:var(--ac-band)}#ac-observation :focus-visible{outline:2px solid var(--ac-blue);outline-offset:3px}#ac-observation input[type=range]{accent-color:var(--ac-blue)}#ac-observation .ac-summary{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:24px}#ac-observation .ac-summary b{display:block;font-size:22px;font-weight:500;margin-top:7px;font-variant-numeric:tabular-nums}#ac-observation .ac-chart{width:100%;height:270px;display:block}#ac-observation .ac-chart text{fill:var(--ac-muted);font:12px -apple-system,sans-serif}#ac-observation .ac-clock{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:18px 0 10px;font-variant-numeric:tabular-nums}#ac-observation .ac-result{padding:16px 0;border-top:1px solid var(--ac-line);margin-top:20px;line-height:1.6}#ac-observation details{margin-top:24px;color:var(--ac-muted);line-height:1.6}#ac-observation footer{padding:14px 24px;border-top:1px solid var(--ac-line);color:var(--ac-muted)}#ac-observation .ac-horizon .ac-layout{grid-template-columns:280px minmax(0,1fr)}#ac-observation .ac-horizon aside{border-left:0;border-right:1px solid var(--ac-line)}#ac-observation .ac-horizon .ac-chart{height:320px}@media(max-width:700px){#ac-observation .ac-layout,#ac-observation .ac-horizon .ac-layout{grid-template-columns:1fr}#ac-observation aside{border:0;border-top:1px solid var(--ac-line)}#ac-observation header{gap:12px}#ac-observation .ac-main,#ac-observation aside,#ac-observation .ac-title{padding:16px}}
</style>
<div class="viz-carousel" aria-label="Propositions pour la préparation des observations" data-previous-label="Précédent" data-next-label="Suivant">
<section data-variant="Nuit & créneaux"><div class="ac-window" data-view="night"></div></section>
<section data-variant="Horizon & trajectoire" hidden><div class="ac-window ac-horizon" data-view="sky"></div></section>
</div>
<script>
(()=>{
const root=document.getElementById('ac-observation');
const saved=window.openai?.widgetState?.modelContent||{};
root.querySelectorAll('[data-view]').forEach(win=>{
const sky=win.dataset.view==='sky';
win.innerHTML=`<header><span class="ac-brand">AstroCapture</span><span class="ac-nav">Images　 Empilement　 Finition　 <strong>Observation</strong></span></header><div class="ac-title"><h2>Préparer une observation</h2><span class="ac-muted">${sky?'Lire la trajectoire dans le ciel':'Trouver le bon créneau, puis comparer les lieux'}</span></div><div class="ac-layout">${sky?'':main()}<aside><h3>Cible & lieu</h3><label><span>Objet</span><select class="ac-target"><option value="orion">M42 · Nébuleuse d’Orion</option><option value="andromeda">M31 · Galaxie d’Andromède</option><option value="carina">NGC 3372 · Carène</option></select></label><label><span>Lieu</span><select class="ac-place"><option value="paris">Paris · Europe/Paris</option><option value="chile">La Serena · America/Santiago</option><option value="sydney">Sydney · Australia/Sydney</option></select></label><label><span>Nuit du</span><input type="date" class="ac-date" value="2026-12-12"></label><label><span>Altitude minimale · <output class="ac-min-label">30°</output></span><input class="ac-min" type="range" min="0" max="80" value="30" aria-label="Altitude minimale en degrés"></label><details><summary>Hypothèses & contraintes</summary>Horizon plat, sans réfraction. En production : obscurité solaire, Lune, éphémérides et coordonnées vérifiées. Météo et disponibilité du télescope à vérifier séparément.</details></aside>${sky?main():''}</div><footer>Proposition d’interface · données de démonstration, non utilisables pour planifier une acquisition</footer>`;
function main(){return `<main class="ac-main"><div class="ac-summary"><div><span class="ac-muted">Altitude au curseur</span><b class="ac-alt">—</b></div><div><span class="ac-muted">État de la cible</span><b class="ac-status">—</b></div></div><h3>${sky?'Trajectoire au-dessus de l’horizon':'Altitude au fil de la nuit · UTC'}</h3><svg class="ac-chart" role="img" aria-label="Trajectoire simulée de la cible"></svg><div class="ac-clock"><span class="ac-local"></span><span class="ac-utc ac-muted"></span></div><input class="ac-time" type="range" min="0" max="12" step="0.1" value="6" aria-label="Parcourir la nuit"><div class="ac-result" aria-live="polite"></div></main>`}
const target=win.querySelector('.ac-target'),place=win.querySelector('.ac-place'),date=win.querySelector('.ac-date'),min=win.querySelector('.ac-min'),time=win.querySelector('.ac-time'),svg=win.querySelector('svg');
target.value=saved.target||'orion';place.value=saved.place||'paris';
const options={showThreshold:true};
function altitude(t){const peaks={orion:{paris:36,chile:64,sydney:62},andromeda:{paris:80,chile:18,sydney:14},carina:{paris:-12,chile:60,sydney:65}};return peaks[target.value][place.value]-48*Math.pow((t-6)/6,2)}
function render(){
if(!date.value)return;
const w=Math.max(260,svg.getBoundingClientRect().width),h=sky?320:270,left=42,right=w-16,top=24,bottom=h-36,x=t=>left+t/12*(right-left),y=a=>bottom-(Math.max(-20,a)+20)/110*(bottom-top);svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
let chart='';if(sky){const cx=w/2,cy=h/2,r=Math.min(w/2-34,h/2-32);chart=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--ac-panel)" stroke="var(--ac-line)"/><circle cx="${cx}" cy="${cy}" r="${r*.5}" fill="none" stroke="var(--ac-line)"/><text x="${cx}" y="18" text-anchor="middle">Nord</text><text x="${cx}" y="${h-8}" text-anchor="middle">Sud · horizon</text>`;const point=t=>{const a=Math.max(0,altitude(t)),rad=(90-a)/90*r,angle=(t/12*180)*Math.PI/180;return [cx+Math.cos(angle)*rad,cy+Math.sin(angle)*rad]};let points=Array.from({length:61},(_,i)=>point(i/5)).map(p=>p.join(',')).join(' ');const p=point(+time.value);chart+=`<polyline points="${points}" fill="none" stroke="var(--ac-blue)" stroke-width="2.5"/><circle cx="${p[0]}" cy="${p[1]}" r="6" fill="var(--ac-blue)"/>`}else{chart=`<rect x="${x(3)}" y="${top}" width="${x(10)-x(3)}" height="${bottom-top}" fill="var(--ac-band)"/><text x="${x(3)+8}" y="${top+16}">Nuit sombre · exemple</text>`;[0,30,60,90].forEach(a=>chart+=`<path d="M${left},${y(a)}H${right}" stroke="var(--ac-line)"/><text x="8" y="${y(a)+4}">${a}°</text>`);[0,3,6,9,12].forEach(t=>chart+=`<text x="${x(t)}" y="${h-10}" text-anchor="${t===0?'start':t===12?'end':'middle'}">${(17+t)%24} h</text>`);const pts=Array.from({length:61},(_,i)=>`${x(i/5)},${y(altitude(i/5))}`).join(' ');chart+=`<polyline points="${pts}" fill="none" stroke="var(--ac-blue)" stroke-width="2.5"/>`;if(options.showThreshold)chart+=`<path d="M${left},${y(+min.value)}H${right}" stroke="var(--ac-muted)" stroke-dasharray="5 5"/>`;chart+=`<path d="M${x(+time.value)},${top}V${bottom}" stroke="var(--ac-muted)"/><circle cx="${x(+time.value)}" cy="${y(altitude(+time.value))}" r="5" fill="var(--ac-blue)"/>`}
svg.innerHTML=chart;const a=altitude(+time.value),dark=+time.value>=3&&+time.value<=10;win.querySelector('.ac-alt').textContent=a.toFixed(1)+'°';win.querySelector('.ac-status').textContent=a<0?'Sous l’horizon':a<+min.value?'Trop basse':dark?'Au-dessus du seuil':'Ciel encore clair';win.querySelector('.ac-min-label').textContent=min.value+'°';const zone={paris:'Europe/Paris',chile:'America/Santiago',sydney:'Australia/Sydney'}[place.value];const instant=new Date(date.value+'T17:00:00Z');instant.setTime(instant.getTime()+time.value*3600000);win.querySelector('.ac-local').textContent=instant.toLocaleString('fr-FR',{timeZone:zone,day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+' · '+zone;win.querySelector('.ac-utc').textContent=instant.toISOString().slice(0,16).replace('T',' ')+' UTC';const hours=Array.from({length:121},(_,i)=>i/10).filter(t=>t>=3&&t<=10&&altitude(t)>=+min.value);win.querySelector('.ac-result').textContent=hours.length?`Créneau simulé : ${(hours.length/10).toFixed(1)} h au-dessus de ${min.value}°, dans la zone sombre de démonstration.`:'Aucun créneau dans cette démonstration avec le seuil choisi.';
}
function change(){render();window.openai?.setWidgetState?.({modelContent:{target:target.value,place:place.value},privateContent:{time:+time.value,min:+min.value}})?.catch(()=>{})}
[target,place,date,min,time].forEach(el=>el.addEventListener('input',change));new ResizeObserver(render).observe(svg);render();if(globalThis.Tweak){const tweak=new Tweak({container:win,onChange:render});tweak.addToggle(options,'showThreshold',{label:'Afficher le seuil sur la courbe'})}
});})();
</script>
</div>
